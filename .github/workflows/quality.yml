name: Verificar TJDFT Dashboard

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Configurar Deno para o validador do snapshot
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compilar aplicação e validar snapshot
        run: |
          npm run test
          deno run --allow-read scripts/validate-tjdft-snapshot.mjs
