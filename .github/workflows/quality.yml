name: Verificar TJDFT Dashboard

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/leis-enhanced.css"
      - "public/reading-preferences.css"
      - "public/reading-preferences.js"
      - "public/sw-register.js"
      - "public/sw.js"
      - "public/manifest.webmanifest"
      - "public/data/**"
      - "supabase/**"
      - "scripts/prepare-github-pages.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".github/workflows/quality.yml"
      - ".github/workflows/study-os-qa.yml"
      - ".github/workflows/post-deploy-smoke.yml"
  workflow_run:
    workflows: ["Sincronizar snapshot TJDFT"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar lint
        run: npm run lint
      - name: Verificar tipos
        run: npm run typecheck
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Configurar Deno para o validador do snapshot
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar Edge Function TJDFT
        run: deno check --config supabase/functions/tjdft-notion/deno.json supabase/functions/tjdft-notion/index.ts
      - name: Testar proveniência parcial dos snapshots
        run: deno test --config supabase/functions/tjdft-notion/deno.json supabase/functions/tjdft-notion/provenance_test.ts
      - name: Compilar aplicação e validar snapshot
        run: |
          GITHUB_PAGES=1 GITHUB_PAGES_BASE_PATH="/tjdft-dashboard" npm run test
          node scripts/validate-portugues-rlm.mjs
          deno run --allow-read scripts/validate-tjdft-snapshot.mjs
