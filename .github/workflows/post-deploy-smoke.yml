name: Smoke do GitHub Pages publicado

on:
  workflow_run:
    workflows: ["Deploy TJDFT dashboard to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Testar rotas publicadas
        shell: bash
        run: |
          set -euo pipefail
          base="https://rodrigorosadantas.github.io/tjdft-dashboard"
          routes=(
            "/"
            "/hoje/"
            "/mentor/"
            "/trilha/"
            "/portugues-rlm/"
            "/portugues-rlm/p01/"
            "/portugues-rlm/rl01/"
            "/portugues-rlm/rev01/"
            "/leis/"
            "/leis/l01/"
            "/revisoes/"
            "/erros/"
            "/desempenho/"
            "/riscos/"
            "/tecnico/"
            "/analista/"
            "/sincronizacao/"
            "/manifest.webmanifest"
            "/data/tjdft-snapshot.json"
          )
          for route in "${routes[@]}"; do
            echo "SMOKE $route"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 30 "$base$route" -o /tmp/smoke
            test -s /tmp/smoke
          done

      - name: Validar marcadores do produto publicado
        shell: bash
        run: |
          set -euo pipefail
          base="https://rodrigorosadantas.github.io/tjdft-dashboard"
          check_marker() {
            local route="$1"
            local marker="$2"
            curl -fsSL --retry 4 --connect-timeout 10 --max-time 30 "$base$route" -o /tmp/marker
            grep -qi "$marker" /tmp/marker
          }
          check_marker "/" "Central de comando"
          check_marker "/hoje/" "Executar agora"
          check_marker "/mentor/" "Por que esta decisão"
          check_marker "/desempenho/" "ausência"
          check_marker "/leis/" "Leis Primeiro"
          check_marker "/portugues-rlm/" "Português Primeiro"
          check_marker "/manifest.webmanifest" '"display"'
          check_marker "/data/tjdft-snapshot.json" '"kind": "notion"'
