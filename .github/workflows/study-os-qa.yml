name: Study OS Visual QA + E2E

on:
  pull_request:
    paths:
      - "app/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "supabase/functions/tjdft-notion/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/study-os-qa.yml"
      - ".github/workflows/post-deploy-smoke.yml"
  push:
    branches: [main]
  workflow_run:
    workflows: ["Sincronizar snapshot TJDFT"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    name: Visual QA
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE_PATH: /tjdft-dashboard
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Montar preview com o base path real do Pages
        run: |
          set -euo pipefail
          mkdir -p /tmp/tjdft-preview/tjdft-dashboard
          cp -a dist/client/. /tmp/tjdft-preview/tjdft-dashboard/
          npx --yes serve@14 /tmp/tjdft-preview -l 4173 > /tmp/tjdft-serve.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/tjdft-dashboard/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tjdft-serve.log
          exit 1
      - name: Validar layout, âncoras, links e rotas em 6 tamanhos
        run: npm run qa:visual
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/tjdft-dashboard
          VISUAL_QA_OUTPUT: artifacts/visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tjdft-study-os-visual-qa
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE_PATH: /tjdft-dashboard
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Montar preview com o base path real do Pages
        run: |
          set -euo pipefail
          mkdir -p /tmp/tjdft-preview/tjdft-dashboard
          cp -a dist/client/. /tmp/tjdft-preview/tjdft-dashboard/
          npx --yes serve@14 /tmp/tjdft-preview -l 4173 > /tmp/tjdft-serve.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/tjdft-dashboard/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tjdft-serve.log
          exit 1
      - name: Percorrer fluxos de execução e retorno à sequência
        run: npm run qa:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/tjdft-dashboard
