name: Sincronizar snapshot TJDFT

on:
  # Mantém o disparo manual disponível para atualizações editoriais do Notion.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/tjdft-notion/**"
      - "scripts/validate-tjdft-snapshot.mjs"
      - "scripts/sync-leis-primeiro.mjs"
      - "scripts/sync-portugues-rlm.mjs"
      - "scripts/validate-portugues-rlm.mjs"
      - "scripts/sync-legislation-bank.mjs"
      - "scripts/export-edital-verticalizado.ts"
      - ".github/workflows/sync-notion.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: tjdft-notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar credencial do Notion
        env:
          TJDFT_NOTION_TOKEN: ${{ secrets.TJDFT_NOTION_TOKEN }}
        run: |
          if [ -z "$TJDFT_NOTION_TOKEN" ]; then
            echo "TJDFT_NOTION_TOKEN não configurado nos secrets do repositório." >&2
            exit 1
          fi

      - name: Gerar snapshots a partir do Notion privado
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write supabase/functions/tjdft-notion/sync.ts
          deno run --allow-net --allow-env --allow-read --allow-write scripts/export-edital-verticalizado.ts
          node scripts/sync-leis-primeiro.mjs
          node scripts/sync-portugues-rlm.mjs
          node scripts/sync-legislation-bank.mjs
        env:
          TJDFT_NOTION_TOKEN: ${{ secrets.TJDFT_NOTION_TOKEN }}
          NOTION_VERSION: "2026-03-11"

      - name: Validar snapshot antes da publicação
        run: |
          deno run --allow-read scripts/validate-tjdft-snapshot.mjs
          node scripts/validate-portugues-rlm.mjs

      - name: Verificar integridade do diff
        run: git diff --check

      - name: Detectar alterações
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data/tjdft-snapshot.json public/data/tjdft-edital.json public/data/leis-primeiro.json public/data/portugues-rlm.json public/data/legislation-bank.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração editorial detectada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Snapshots TJDFT, Leis Primeiro e Português/RLM prontos para publicação."
          fi

      - name: Publicar snapshots no GitHub
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tjdft-snapshot.json public/data/tjdft-edital.json public/data/leis-primeiro.json public/data/portugues-rlm.json public/data/legislation-bank.json
          git commit -m "Sync TJDFT snapshots from Notion"
          git pull --rebase origin main
          git push origin HEAD:main
