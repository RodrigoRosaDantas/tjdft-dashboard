name: Sincronizar snapshot TJDFT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/tjdft-notion/**"
      - "scripts/validate-tjdft-snapshot.mjs"
      - ".github/workflows/sync-notion.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: tjdft-notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validar credencial do Notion
        env:
          TJDFT_NOTION_TOKEN: ${{ secrets.TJDFT_NOTION_TOKEN }}
        run: |
          if [ -z "$TJDFT_NOTION_TOKEN" ]; then
            echo "TJDFT_NOTION_TOKEN não configurado nos secrets do repositório." >&2
            exit 1
          fi

      - name: Gerar snapshot a partir do Notion privado
        run: deno run --allow-net --allow-env --allow-read --allow-write supabase/functions/tjdft-notion/sync.ts
        env:
          TJDFT_NOTION_TOKEN: ${{ secrets.TJDFT_NOTION_TOKEN }}

      - name: Validar snapshot antes da publicação
        run: deno run --allow-read scripts/validate-tjdft-snapshot.mjs

      - name: Verificar integridade do diff
        run: git diff --check

      - name: Detectar alterações
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- public/data/tjdft-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração editorial detectada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot novo pronto para publicação."
          fi

      - name: Publicar snapshot no GitHub
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tjdft-snapshot.json
          git commit -m "Sync TJDFT snapshot from Notion"
          git push origin HEAD:main
