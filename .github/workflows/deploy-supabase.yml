name: Deploy TJDFT backend to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-tjdft-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: ugxdmvlynyzfmmgshvyq
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure o secret SUPABASE em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure Notion secret for Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}
          TJDFT_NOTION_TOKEN: ${{ secrets.TJDFT_NOTION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TJDFT_NOTION_TOKEN" ]; then
            echo "::error::Configure o secret TJDFT_NOTION_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
          secret_file="$RUNNER_TEMP/tjdft-notion.env"
          umask 077
          printf 'TJDFT_NOTION_TOKEN=%s\n' "$TJDFT_NOTION_TOKEN" > "$secret_file"
          supabase secrets set --env-file "$secret_file" --project-ref "$SUPABASE_PROJECT_ID"
          rm -f "$secret_file"

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}
        run: supabase functions deploy tjdft-notion --project-ref "$SUPABASE_PROJECT_ID"
